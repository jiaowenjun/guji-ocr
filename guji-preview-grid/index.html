<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>古籍预览 · guji-preview-grid</title>
    <script>
      // 防 FOUC：React 挂载前按持久化设置 + 系统偏好先行上色（与 use-theme.ts 同口径）
      try {
        var s = localStorage.getItem("guji-theme");
        var dark =
          s === "dark" ||
          ((s === null || s === "auto") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
